<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rookieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5C4033;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer ring -->
  <circle cx="128" cy="128" r="110" fill="url(#rookieGrad)" opacity="0.3"/>
  
  <!-- Main badge -->
  <circle cx="128" cy="128" r="90" fill="url(#rookieGrad)" filter="url(#glow)"/>
  
  <!-- Inner details -->
  <circle cx="128" cy="128" r="75" fill="none" stroke="#A0826D" stroke-width="2" opacity="0.6"/>
  <circle cx="128" cy="128" r="60" fill="none" stroke="#A0826D" stroke-width="1" opacity="0.4"/>
  
  <!-- Star shape in center -->
  <path d="M128 70 L138 100 L170 100 L145 120 L155 150 L128 130 L101 150 L111 120 L86 100 L118 100 Z" 
        fill="#FFF" opacity="0.7"/>
  
  <!-- Text -->
  <text x="128" y="200" font-family="Arial, sans-serif" font-size="20" font-weight="bold" 
        fill="#FFF" text-anchor="middle">ROOKIE</text>
</svg>
