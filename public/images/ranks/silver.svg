<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C0C0C0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A8A8A8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer ring -->
  <circle cx="128" cy="128" r="110" fill="url(#silverGrad)" opacity="0.4"/>
  
  <!-- Main badge -->
  <circle cx="128" cy="128" r="90" fill="url(#silverGrad)" filter="url(#glow)"/>
  
  <!-- Inner details -->
  <circle cx="128" cy="128" r="75" fill="none" stroke="#F0F0F0" stroke-width="3" opacity="0.8"/>
  <circle cx="128" cy="128" r="60" fill="none" stroke="#F0F0F0" stroke-width="2" opacity="0.6"/>
  
  <!-- Hexagon shape in center -->
  <path d="M128 55 L170 80 L170 130 L128 155 L86 130 L86 80 Z" 
        fill="#FFF" opacity="0.85"/>
  
  <!-- Inner star -->
  <path d="M128 85 L135 105 L155 105 L140 117 L145 137 L128 125 L111 137 L116 117 L101 105 L121 105 Z" 
        fill="#C0C0C0" opacity="0.7"/>
  
  <!-- Text -->
  <text x="128" y="200" font-family="Arial, sans-serif" font-size="20" font-weight="bold" 
        fill="#444" text-anchor="middle">SILVER</text>
</svg>
